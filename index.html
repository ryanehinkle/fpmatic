<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FPmatic • Topgolf Floor Plans</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css?v=20261016b">
</head>
<body>
<header class="site-header">
  <div class="brand" id="brand" title="FPmatic">
    <div class="brand-mark">FP</div>
    <div><h1><span>FP</span>matic</h1><div class="brand-caption">EVENT FLOOR PLAN BUILDER</div></div>
  </div>
  <div class="header-actions">
    <button id="newUpload" class="button subtle" type="button">＋ Upload reports</button>
    <button id="beoUpload" class="button subtle" type="button" title="Optional BEO PDF import">BEO PDF</button>
    <button id="resetAll" class="button subtle" type="button" title="Start over with a new weekly BEO packet">Reset</button>
    <label class="button subtle" id="masterPicker" for="templateInput" title="Load an existing Excel floor plan, including pre-merged sections">Excel master</label>
    <button id="export" class="button primary" type="button" disabled>↓ Export Floor Plan</button>
  </div>
</header>
<main>
  <section class="intro panel" id="intro">
    <div class="brand-mark landing-mark">FP</div>
    <h2 class="brand-title"><span>FP</span>matic</h2>
    <p class="landing-subtitle">Upload reports</p>
    <div class="reports-grid" id="reportsDropzone">
      <label class="report-file" for="staffInput" id="staffBox">
        <span class="report-file-name">Event Staffing</span>
        <span class="report-file-status" id="staffFileName">Choose CSV</span>
      </label>
      <label class="report-file" for="menuInput" id="menuBox">
        <span class="report-file-name">Catering Menus</span>
        <span class="report-file-status" id="menuFileName">Choose CSV</span>
      </label>
      <label class="report-file optional-report" for="currentInput" id="currentBox">
        <span class="report-file-name">Current floorplan <span class="optional-label">(Optional)</span></span>
        <span class="report-file-status" id="currentFileName">Choose XLSX</span>
      </label>
    </div>
    <button id="buildFromReports" type="button" class="button primary upload-button" disabled>Build floor plan</button>
    <p class="report-feedback" id="reportFeedback" role="status" aria-live="polite"></p>
    <button id="beoLanding" type="button" class="link-button">Use BEO PDF instead</button>
  </section>
  <section class="workspace" id="workspace" hidden>
    <div class="top-row">
      <div><h2 id="weekTitle">Floor Plan</h2><div class="week-subtitle" id="fileSummary"></div></div>
      <div class="week-control"><button id="prevWeek" title="Previous week">‹</button><span id="weekPickerLabel"></span><button id="nextWeek" title="Next week">›</button></div>
    </div>
    <div class="stats"><div class="stat"><strong id="statEvents">0</strong><span>EVENTS</span></div><div class="stat"><strong id="statPlotted">0</strong><span>PLOTTED</span></div><div class="stat"><strong id="statNeeds">0</strong><span>REVIEW</span></div><div class="stat"><strong id="statStatus">—</strong><span>DEFINITE</span></div></div>
    <nav class="day-tabs" id="dayTabs" aria-label="Day of week"></nav>
    <div class="work-grid">
      <section class="board-panel panel">
        <div class="panel-heading"><div><h3 id="dayHeading">Monday</h3><div class="mini" id="daySubheading"></div></div><div class="board-tools"><button class="button subtle small" id="toggleNames">Hide bays</button><span id="dayTotal" class="count-pill"></span></div></div>
        <div class="board-scroll"><div id="floorBoards" class="floor-boards"></div></div>
        <div class="board-foot">Yellow: couch bays · White: high-tops · Click event to edit</div>
      </section>
      <aside class="right-col">
        <section class="panel"><div class="panel-heading"><h3>Events</h3><span id="eventListCount" class="count-pill">0</span></div><div class="list-filters"><input type="search" id="eventSearch" placeholder="Search events or bays" aria-label="Search events"><select id="eventFilter" aria-label="Filter events"><option value="all">All events</option><option value="issues">Needs review</option><option value="AM">AM only</option><option value="PM">PM only</option></select></div><div id="eventList" class="event-list"></div><button id="addEvent" class="button subtle add-event" type="button">＋ Add event manually</button></section>
        <section class="panel issues-panel"><div class="panel-heading"><h3>Review</h3><span id="issueCount" class="count-pill">0</span></div><div id="issues" class="issue-list"></div></section>
        <section class="panel change-panel" id="changePanel" hidden><div class="panel-heading"><h3>Changes</h3><span id="changeCount" class="count-pill">0</span></div><div id="changeList" class="change-list"></div></section>
      </aside>
    </div>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="editorDialog" class="editor-dialog">
<form id="editorForm" method="dialog">
  <div class="modal-heading"><div><div class="eyebrow">EVENT DETAILS</div><h2 id="editorTitle">Edit event</h2></div><button class="icon-button" type="button" id="closeEditor" aria-label="Close">×</button></div>
  <div class="form-grid">
  <label class="wide">Event name<input id="editName" required></label>
  <label>Event date<input id="editDate" type="date" required></label>
  <label>Guest count<input id="editGuests" type="number" min="0"></label>
  <label>Start time<input id="editStart" type="time" required></label>
  <label>End time<input id="editEnd" type="time" required></label>
  <label>Golf start (optional)<input id="editGolfStart" type="time"></label>
  <label>Golf end (optional)<input id="editGolfEnd" type="time"></label>
  <label>Assigned bays (e.g. 205-214)<input id="editBays" placeholder="205-214"></label>
  <label>Event space<input id="editSpace" placeholder="Sig S, Full Sig, LL…"></label>
  <label>Floor-plan label<input id="editPackage" placeholder="Flex, Fajita, Ultimate..."></label>
  <label>Color category<select id="editCategory"><option>Flex</option><option>Pleaser</option><option>Buffet</option><option>Field Trip</option><option>Youth</option></select></label>
  <label>Booking status<select id="editStatus"><option>Definite</option><option>Tentative</option></select></label>
  </div>
  <div class="editor-note" id="editorNote"></div>
  <div class="modal-footer"><button id="deleteEvent" type="button" class="button dangerous">Delete</button><div class="footer-right"><button id="cancelEditor" type="button" class="button subtle">Cancel</button><button type="submit" class="button primary">Save event</button></div></div>
</form>
</dialog>
<input id="pdfInput" type="file" accept=".pdf,application/pdf" multiple hidden>
<input id="staffInput" type="file" accept=".csv,text/csv" hidden>
<input id="menuInput" type="file" accept=".csv,text/csv" hidden>
<input id="currentInput" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
<input id="csvInput" type="file" accept=".csv,text/csv" multiple hidden>
<input id="templateInput" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
<script src="./jszip.min.js?v=20261010d"></script>
<script type="module" src="app.js?v=20261016b"></script>
</body>
</html>
