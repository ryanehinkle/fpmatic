name: Deploy FPmatic to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify exact master export
        run: node tests/floorplan-regression.mjs
      - name: Verify pre-merged weekly masters
        run: node tests/premerged-master.test.cjs
      - name: Verify current floorplan reconciliation
        run: node tests/current-floorplan.test.cjs
      - name: Verify CSV report imports
        run: node tests/csv-import.test.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
